<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blackjack Royale</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at top, #176b45, #063522 60%, #021b11);
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.screen {
    display: none;
    min-height: 100vh;
    padding: 25px;
}

.screen.active {
    display: flex;
}

#home {
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
}

.logo {
    font-size: 52px;
    font-weight: 900;
    margin-bottom: 40px;
}

.mainButton {
    width: 280px;
    padding: 18px;
    margin: 10px;
    border: 0;
    border-radius: 15px;
    font-size: 24px;
    font-weight: bold;
    background: white;
    color: #073522;
}

.panel {
    width: min(500px, 95vw);
    margin: auto;
    padding: 30px;
    border-radius: 22px;
    background: #062c1cee;
    text-align: center;
}

.back {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 16px;
    border: 0;
    border-radius: 10px;
    background: #ffffff22;
    color: white;
}

input {
    width: 100%;
    padding: 15px;
    margin: 7px 0;
    border: 0;
    border-radius: 10px;
}

.actionButton {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: 0;
    border-radius: 10px;
    background: white;
    color: #073522;
    font-weight: bold;
}

.error {
    min-height: 25px;
    margin-top: 12px;
    color: #ffb0b0;
}

.roomCode {
    margin: 20px;
    font-size: 38px;
    font-weight: bold;
    letter-spacing: 7px;
}

.player {
    margin: 7px 0;
    padding: 12px;
    border-radius: 10px;
    background: #ffffff12;
}

#game {
    flex-direction: column;
}

.topInfo {
    text-align: center;
    margin-bottom: 10px;
    font-size: 18px;
}

.table {
    width: min(1100px, 100%);
    min-height: 620px;
    margin: auto;
    padding: 25px;
    border: 8px solid #4b2a12;
    border-radius: 35px;
    background:
        radial-gradient(circle, #15804f, #075331);
    box-shadow: inset 0 0 40px #0008;
}

.dealer {
    text-align: center;
    margin-bottom: 25px;
}

.cards {
    min-height: 82px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
}

.card {
    width: 55px;
    height: 78px;
    border-radius: 8px;
    background: white;
    color: black;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 21px;
    font-weight: bold;
}

.card.red {
    color: #d00000;
}

.hiddenCard {
    background: #244b9b;
    color: white;
}

.playersTable {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.seat {
    min-height: 245px;
    padding: 13px;
    border: 2px solid transparent;
    border-radius: 16px;
    background: #0003;
    text-align: center;
}

.seat.active {
    border-color: #ffe45c;
    box-shadow: 0 0 20px #ffe45c55;
}

.seatName {
    font-weight: bold;
    font-size: 18px;
}

.balance {
    margin-top: 5px;
}

.bet {
    margin: 5px;
    font-weight: bold;
}

.status {
    min-height: 22px;
    margin: 7px;
    font-weight: bold;
}

.controls {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 20px;
}

.gameButton,
.chipButton {
    padding: 13px 18px;
    border: 0;
    border-radius: 11px;
    background: white;
    color: #073522;
    font-weight: bold;
}

.gameButton:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.chips {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 7px;
    margin: 15px;
}

.message {
    min-height: 28px;
    margin: 12px;
    text-align: center;
    font-weight: bold;
}

@media(max-width:750px) {
    .playersTable {
        grid-template-columns: repeat(2, 1fr);
    }

    .logo {
        font-size: 38px;
    }
}
</style>
</head>

<body>

<section id="home" class="screen active">

    <div class="logo">
        ♠ BLACKJACK ROYALE ♠
    </div>

    <button
        class="mainButton"
        onclick="startSingleplayer()">
        PLAY
    </button>

    <button
        class="mainButton"
        onclick="showMultiplayer()">
        SAMENSPELEN
    </button>

</section>


<section id="multiplayer" class="screen">

    <button class="back" onclick="goHome()">
        ← TERUG
    </button>

    <div class="panel">

        <h1>👥 SAMENSPELEN</h1>

        <input
            id="playerName"
            maxlength="18"
            placeholder="Jouw naam">

        <button
            class="actionButton"
            onclick="createRoom()">
            KAMER MAKEN
        </button>

        <hr>

        <input
            id="joinCode"
            maxlength="6"
            placeholder="KAMERCODE"
            style="text-transform:uppercase">

        <button
            class="actionButton"
            onclick="joinRoom()">
            JOIN KAMER
        </button>

        <div id="roomError" class="error"></div>

    </div>

</section>


<section id="lobby" class="screen">

    <button class="back" onclick="leaveRoom()">
        ← VERLATEN
    </button>

    <div class="panel">

        <h1>🎮 KAMER</h1>

        <div id="lobbyCode" class="roomCode"></div>

        <div id="lobbyPlayers"></div>

        <button
            id="startGameButton"
            class="actionButton"
            onclick="startGame()">
            START SPEL
        </button>

        <div id="lobbyError" class="error"></div>

    </div>

</section>


<section id="game" class="screen">

    <div class="topInfo">

        <span id="roomInfo"></span>
        &nbsp; | &nbsp;
        <span id="balanceInfo"></span>

    </div>

    <div class="table">

        <div class="dealer">

            <h2>DEALER</h2>

            <div
                id="dealerCards"
                class="cards">
            </div>

            <div id="dealerTotal"></div>

        </div>

        <div
            id="playersTable"
            class="playersTable">
        </div>

        <div
            id="betControls"
            style="display:none">

            <div class="chips">

                <button class="chipButton"
                    onclick="bet(5)">5</button>

                <button class="chipButton"
                    onclick="bet(10)">10</button>

                <button class="chipButton"
                    onclick="bet(25)">25</button>

                <button class="chipButton"
                    onclick="bet(50)">50</button>

                <button class="chipButton"
                    onclick="bet(100)">100</button>

                <button class="chipButton"
                    onclick="bet(500)">500</button>

            </div>

            <div class="controls">

                <button
                    id="startRoundButton"
                    class="gameButton"
                    onclick="startRound()">
                    START RONDE
                </button>

            </div>

        </div>

        <div id="gameMessage" class="message"></div>

        <div class="controls">

            <button
                id="hitButton"
                class="gameButton"
                onclick="hit()">
                HIT
            </button>

            <button
                id="standButton"
                class="gameButton"
                onclick="stand()">
                STAND
            </button>

            <button
                id="doubleButton"
                class="gameButton"
                onclick="doubleDown()">
                DOUBLE
            </button>

            <button
                id="splitButton"
                class="gameButton"
                onclick="split()">
                SPLIT
            </button>

            <button
                id="nextButton"
                class="gameButton"
                onclick="nextRound()"
                style="display:none">
                VOLGENDE RONDE
            </button>

        </div>

    </div>

</section>


<script>

const SERVER_URL =
    "https://meesmulder-67-github-io.onrender.com";

const socket = io(SERVER_URL, {
    transports: ["websocket", "polling"]
});

let state = null;


/* =========================
   NAVIGATION
========================= */

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(s => s.classList.remove("active"));

    document
        .getElementById(id)
        .classList.add("active");
}

function goHome() {
    showScreen("home");
}

function showMultiplayer() {
    showScreen("multiplayer");

    document.getElementById(
        "roomError"
    ).textContent = "";
}


/* =========================
   SOCKET
========================= */

socket.on("connect", () => {
    console.log("Connected:", socket.id);
});

socket.on("connect_error", error => {

    console.error(error);

    document.getElementById(
        "roomError"
    ).textContent =
        "Serververbinding mislukt.";
});

socket.on("roomCreated", room => {
    renderLobby(room);
    showScreen("lobby");
});

socket.on("roomJoined", room => {
    renderLobby(room);
    showScreen("lobby");
});

socket.on("roomUpdate", room => {
    renderLobby(room);
});

socket.on("joinError", message => {
    document.getElementById(
        "roomError"
    ).textContent = message;
});

socket.on("gameError", message => {
    document.getElementById(
        "gameMessage"
    ).textContent = message;
});

socket.on("gameState", newState => {

    state = newState;

    showScreen("game");

    renderGame(newState);
});


/* =========================
   ROOM
========================= */

function getName() {

    return document
        .getElementById("playerName")
        .value
        .trim();
}

function createRoom() {

    const name = getName();

    if (!name) {

        document.getElementById(
            "roomError"
        ).textContent =
            "Vul eerst je naam in.";

        return;
    }

    socket.emit(
        "createRoom",
        { name }
    );
}

function joinRoom() {

    const name = getName();

    const code = document
        .getElementById("joinCode")
        .value
        .trim()
        .toUpperCase();

    if (!name) {

        document.getElementById(
            "roomError"
        ).textContent =
            "Vul eerst je naam in.";

        return;
    }

    if (code.length !== 6) {

        document.getElementById(
            "roomError"
        ).textContent =
            "De code moet 6 tekens hebben.";

        return;
    }

    socket.emit(
        "joinRoom",
        {
            name,
            code
        }
    );
}

function renderLobby(room) {

    document.getElementById(
        "lobbyCode"
    ).textContent = room.code;

    const list =
        document.getElementById(
            "lobbyPlayers"
        );

    list.innerHTML = "";

    room.players.forEach(player => {

        const div =
            document.createElement("div");

        div.className = "player";

        div.textContent =
            player.name +
            (
                player.id === room.hostId
                    ? " 👑 HOST"
                    : ""
            );

        list.appendChild(div);
    });

    document.getElementById(
        "startGameButton"
    ).style.display =
        room.hostId === socket.id
            ? "block"
            : "none";
}

function startGame() {
    socket.emit("startGame");
}

function leaveRoom() {
    socket.emit("leaveRoom");
    state = null;
    showScreen("home");
}


/* =========================
   BETTING
========================= */

function bet(amount) {

    if (!state) return;

    socket.emit(
        "placeBet",
        { amount }
    );
}

function startRound() {
    socket.emit("startRound");
}


/* =========================
   GAME
========================= */

function renderGame(state) {

    document.getElementById(
        "roomInfo"
    ).textContent =
        "Kamer: " + state.code;

    document.getElementById(
        "balanceInfo"
    ).textContent =
        "Nepcredits: " + state.myBalance;

    renderDealer(state);

    const table =
        document.getElementById(
            "playersTable"
        );

    table.innerHTML = "";

    state.players.forEach(player => {

        const seat =
            document.createElement("div");

        seat.className =
            "seat" +
            (
                player.active
                    ? " active"
                    : ""
            );

        seat.innerHTML = `
            <div class="seatName">
                ${escapeHtml(player.name)}
            </div>

            <div class="balance">
                💰 ${player.balance}
            </div>

            <div class="bet">
                Inzet: ${player.bet}
            </div>

            <div class="status">
                ${player.status}
            </div>

            <div class="cards"></div>
        `;

        renderCards(
            seat.querySelector(".cards"),
            player.cards
        );

        table.appendChild(seat);
    });

    const betting =
        state.phase === "betting";

    const playing =
        state.phase === "playing";

    const myTurn =
        state.currentPlayerId === socket.id;

    document.getElementById(
        "betControls"
    ).style.display =
        betting ? "block" : "none";

    document.getElementById(
        "hitButton"
    ).disabled =
        !(playing && myTurn);

    document.getElementById(
        "standButton"
    ).disabled =
        !(playing && myTurn);

    document.getElementById(
        "doubleButton"
    ).disabled =
        !(playing && myTurn);

    document.getElementById(
        "splitButton"
    ).disabled =
        !(playing && myTurn);

    document.getElementById(
        "nextButton"
    ).style.display =
        state.phase === "finished" &&
        state.hostId === socket.id
            ? "inline-block"
            : "none";

    if (state.resultMessage) {

        document.getElementById(
            "gameMessage"
        ).textContent =
            state.resultMessage;

    } else if (myTurn) {

        document.getElementById(
            "gameMessage"
        ).textContent =
            "Jij bent aan de beurt.";

    } else if (betting) {

        document.getElementById(
            "gameMessage"
        ).textContent =
            "Plaats je nep-inzet.";

    } else {

        document.getElementById(
            "gameMessage"
        ).textContent =
            "Wachten...";
    }
}

function renderDealer(state) {

    const container =
        document.getElementById(
            "dealerCards"
        );

    container.innerHTML = "";

    state.dealerCards.forEach(
        (card, index) => {

            if (
                state.dealerHidden &&
                index === 1
            ) {

                const div =
                    document.createElement("div");

                div.className =
                    "card hiddenCard";

                div.textContent = "?";

                container.appendChild(div);

            } else {

                addCard(
                    container,
                    card
                );
            }
        }
    );

    document.getElementById(
        "dealerTotal"
    ).textContent =
        state.dealerHidden
            ? "Dealer: ?"
            : "Dealer: " +
              handValue(
                  state.dealerCards
              );
}


/* =========================
   ACTIONS
========================= */

function hit() {
    socket.emit("hit");
}

function stand() {
    socket.emit("stand");
}

function doubleDown() {
    socket.emit("double");
}

function split() {
    socket.emit("split");
}

function nextRound() {
    socket.emit("nextRound");
}


/* =========================
   CARDS
========================= */

function renderCards(container, cards) {

    container.innerHTML = "";

    cards.forEach(card => {
        addCard(container, card);
    });
}

function addCard(container, card) {

    const div =
        document.createElement("div");

    div.className = "card";

    if (
        card.suit === "♥" ||
        card.suit === "♦"
    ) {
        div.classList.add("red");
    }

    div.textContent =
        card.value + card.suit;

    container.appendChild(div);
}

function handValue(cards) {

    let total = 0;
    let aces = 0;

    cards.forEach(card => {

        if (
            ["J", "Q", "K"]
                .includes(card.value)
        ) {
            total += 10;

        } else if (
            card.value === "A"
        ) {
            total += 11;
            aces++;

        } else {
            total += Number(card.value);
        }
    });

    while (
        total > 21 &&
        aces > 0
    ) {
        total -= 10;
        aces--;
    }

    return total;
}

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================
   SINGLEPLAYER
========================= */

function startSingleplayer() {

    alert(
        "Singleplayer wordt geopend zodra de multiplayerverbinding werkt."
    );
}

</script>

</body>
</html>
